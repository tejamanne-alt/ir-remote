; ESP32 IR bridge firmware, API v1 (docs/BRIDGE_API.md).
;
; CI:
;   pio run -e esp32dev          firmware image (.pio/build/esp32dev/firmware.bin)
;   pio test -e native           bridge_core unit tests on the host (real Unity)
;   tools/run_host_tests.sh      same tests with g++ + ASan/UBSan, no PlatformIO
;
; Versions are pinned for reproducible builds. They were taken from the
; upstream release tags on 2026-11-09; the PlatformIO registry was not
; reachable from the authoring environment, so the first CI run is also the
; first time these pins are resolved. See README.md, "Third-party".

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
; Two 1.875 MB OTA app slots (the default table's 1.25 MB slots are too tight
; for Wi-Fi + web server + every IRremoteESP8266 decoder).
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; HTTP + WebSocket use ESP-IDF's esp_http_server (Apache-2.0), part of the
; Arduino-ESP32 core: no web-server library dependency.
lib_deps =
    crankyoldgit/IRremoteESP8266 @ 2.9.0
build_flags =
    -Wall
    -Wextra
    ; Info-level logs for bring-up (human gate H2); lower for releases.
    -DCORE_DEBUG_LEVEL=3
; The native suite is for the host; it is not meant to run on the board.
test_ignore = test_native

[env:native]
platform = native @ 1.2.1
test_framework = unity
; Only lib/bridge_core is compiled with the tests; src/ is Arduino-only.
test_build_src = no
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -DUNITY_SUPPORT_64
    -DBRIDGE_HOST_TEST
