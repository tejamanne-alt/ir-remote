include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - lib/l10n/app_localizations*.dart
    - test/data/generated/**

linter:
  rules:
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
