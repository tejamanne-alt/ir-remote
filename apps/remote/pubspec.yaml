name: irremote
description: "IR universal remote for TVs, set-top boxes, ACs and more."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bonsoir: ^7.1.6
  code_db:
    path: ../../packages/code_db
  drift: '>=2.20.0 <3.0.0'
  drift_flutter: ^0.3.1
  intl: any
  ir_core:
    path: ../../packages/ir_core
  ir_transports:
    path: ../../packages/ir_transports
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: '>=2.4.0 <3.0.0'
  drift_dev: '>=2.20.0 <3.0.0'
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/oem_quirks.json
    - assets/codes/
